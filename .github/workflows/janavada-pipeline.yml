name: Legacy Base44 Pipeline (manual only)

on:
  workflow_dispatch:

concurrency:
  group: janavada-legacy-base44-pipeline
  cancel-in-progress: false

jobs:
  legacy-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Legacy Base44 pipeline status only
        shell: bash
        run: |
          set -euo pipefail
          echo "The scheduled Base44 publishing pipeline is disabled. JanaVada CMS/Worker cron is now authoritative."
          curl --fail-with-body --max-time 60 \
            -X POST 'https://janavada-news.base44.app/functions/pipelineProcessClusters' \
            -H 'Content-Type: application/json' \
            --data '{"action":"status"}' | jq .
