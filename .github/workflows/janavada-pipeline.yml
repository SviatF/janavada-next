name: JanaVada News Pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: janavada-news-pipeline
  cancel-in-progress: false

jobs:
  newsroom-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Process fresh sources
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --retry 2 --retry-delay 5 --max-time 600 \
            -X POST 'https://janavada-news.base44.app/functions/pipelineProcessClusters' \
            -H 'Content-Type: application/json' \
            --data '{"action":"process"}')"
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null

      - name: Publish due stories
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --retry 2 --retry-delay 5 --max-time 300 \
            -X POST 'https://janavada-news.base44.app/functions/pipelinePublishWorker' \
            -H 'Content-Type: application/json' \
            --data '{"action":"publish"}')"
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null

      - name: Pipeline status
        if: always()
        shell: bash
        run: |
          curl --fail-with-body --max-time 60 \
            -X POST 'https://janavada-news.base44.app/functions/pipelineProcessClusters' \
            -H 'Content-Type: application/json' \
            --data '{"action":"status"}' | jq .
